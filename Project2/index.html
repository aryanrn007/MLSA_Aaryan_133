<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for modern icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>KeyForge</h1>
            <p>Advanced Password Generator</p>
        </header>

        <main>
            <!-- Primary Display Area -->
            <div class="display-section">
                <div class="password-display">
                    <input type="text" id="password-output" readonly placeholder="Your password will appear here">
                    <div class="display-actions">
                        <button id="toggle-mask-btn" class="icon-btn" title="Show/Hide Password" aria-label="Toggle Password Visibility">
                            <i class="ph ph-eye"></i>
                        </button>
                        <button id="copy-btn" class="icon-btn" title="Copy to Clipboard" aria-label="Copy to Clipboard">
                            <i class="ph ph-copy"></i>
                        </button>
                    </div>
                </div>
                <div class="strength-meter-container">
                    <div class="strength-meter-bar" id="strength-bar"></div>
                </div>
                <div class="strength-text" id="strength-text">Awaiting generation...</div>
            </div>

            <!-- Settings Area -->
            <div class="settings-section">
                <div class="setting-group">
                    <label for="length-slider">
                        Password Length: <span id="length-val">16</span>
                    </label>
                    <input type="range" id="length-slider" min="4" max="128" value="16">
                </div>

                <div class="setting-group">
                    <label>Character Types</label>
                    <div class="checkbox-group">
                        <label class="checkbox-container">
                            <input type="checkbox" id="chk-uppercase" checked>
                            <span class="checkmark"></span>
                            Uppercase (A-Z)
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" id="chk-lowercase" checked>
                            <span class="checkmark"></span>
                            Lowercase (a-z)
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" id="chk-numbers" checked>
                            <span class="checkmark"></span>
                            Numbers (0-9)
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" id="chk-symbols" checked>
                            <span class="checkmark"></span>
                            Symbols (!@#$...)
                        </label>
                    </div>
                </div>

                <div class="setting-group inline-group">
                    <label for="num-passwords">Generate Multiple:</label>
                    <input type="number" id="num-passwords" min="1" max="100" value="1">
                </div>

                <button id="generate-btn" class="primary-btn">
                    <i class="ph ph-lightning"></i> Generate Password
                </button>
            </div>

            <!-- History / Multiple Output Area -->
            <div class="history-section" id="history-section" style="display: none;">
                <div class="history-header">
                    <h2>Generated Passwords</h2>
                    <div class="history-actions">
                        <button id="save-txt-btn" class="secondary-btn" title="Save to TXT">
                            <i class="ph ph-download-simple"></i> Save
                        </button>
                        <button id="clear-history-btn" class="secondary-btn" title="Clear History">
                            <i class="ph ph-trash"></i> Clear
                        </button>
                    </div>
                </div>
                <ul class="history-list" id="history-list">
                    <!-- History items injected here -->
                </ul>
            </div>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
